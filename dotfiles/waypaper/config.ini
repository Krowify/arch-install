; Deployed by 5-dotfiles.sh. backend=awww: waypaper is a GUI picker, awww is
; what actually renders the wallpaper (installed in stage 2, official repo --
; renamed from 'swww' in October 2025). post_command re-themes the desktop
; via Matugen every time you pick a new wallpaper -- unconditionally, even
; if a curated theme.sh theme (e.g. Tokyo Night) is currently active; see
; the README's theme switching section for why that's intentional -- see
; the README's color theming section for the Matugen pipeline itself.
[Settings]
backend = awww
post_command = matugen image "$wallpaper"
