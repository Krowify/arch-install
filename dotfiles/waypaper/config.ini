; Deployed by 5-dotfiles.sh. backend=swww: waypaper is a GUI picker, swww is
; what actually renders the wallpaper (installed alongside it, see
; 3-user-software.sh). post_command re-themes the desktop via Matugen every
; time you pick a new wallpaper -- see the README's color theming section.
[Settings]
backend = swww
post_command = matugen image "$wallpaper"
