; Deployed by 5-dotfiles.sh. backend=awww: waypaper is a GUI picker, awww is
; what actually renders the wallpaper (installed in stage 2, official repo --
; renamed from 'swww' in October 2025). post_command re-themes the desktop
; via Matugen every time you pick a new wallpaper -- see the README's color
; theming section.
[Settings]
backend = awww
post_command = matugen image "$wallpaper"
