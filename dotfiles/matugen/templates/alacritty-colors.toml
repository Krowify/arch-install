# Matugen template -- input for [templates.alacritty] in config.toml.
# Generates ~/.config/alacritty/colors.toml from the current wallpaper.
# Only background/foreground/cursor -- see colors.toml's own header
# comment for why the ANSI palette stays out of this.

[colors.primary]
background = "{{colors.surface.default.hex}}"
foreground = "{{colors.on_surface.default.hex}}"

[colors.cursor]
text = "{{colors.surface.default.hex}}"
cursor = "{{colors.tertiary.default.hex}}"
