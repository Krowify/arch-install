# Deployed by 5-dotfiles.sh. Accent colors use a custom dark palette
# ported from notusknot/dotfiles-nix (see README credits) -- GTK/SDDM
# chrome still uses the Catppuccin Mocha theme installed in stage 3, since
# no packaged GTK theme matches this exact palette. __CURSOR_THEME__ is
# replaced with whatever Bibata variant was actually detected on disk --
# see 5-dotfiles.sh.

monitor = , preferred, auto, auto

env = XCURSOR_THEME,__CURSOR_THEME__
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,__CURSOR_THEME__
env = HYPRCURSOR_SIZE,24

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
    sensitivity = 0
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    # Mauve -> Blue, the theme's two main accents
    col.active_border = rgba(b072d1ee) rgba(3fc6deee) 45deg
    col.inactive_border = rgba(44465caa)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 0.95
    blur {
        enabled = true
        size = 6
        passes = 2
    }
    shadow {
        enabled = true
        range = 12
        color = rgba(2e303ecc)
    }
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    animation = windows, 1, 4, easeOutQuint
    animation = windowsOut, 1, 4, easeOutQuint, popin 80%
    animation = border, 1, 6, default
    animation = fade, 1, 4, default
    animation = workspaces, 1, 4, easeOutQuint
}

dwindle {
    # 'pseudotile' (default-on pseudotiling for every new window) was
    # removed in Hyprland 0.55 -- pseudotiling is per-window only now,
    # via the 'pseudo' dispatcher (see the $mod+P bind below).
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# --- Autostart ------------------------------------------------------------
exec-once = waybar
exec-once = mako
exec-once = swaybg -c 292a37
exec-once = hypridle
exec-once = systemctl --user enable --now hyprpolkitagent.service
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = plank
exec-once = wl-paste --watch cliphist store
exec-once = eww daemon

# --- Window rules -----------------------------------------------------------
# windowrulev2 was deprecated in favor of windowrule, which as of the 0.53
# window-rule overhaul requires a 'match:' prefix instead of bare
# class:/title: -- see https://github.com/hyprwm/Hyprland/discussions/13115
windowrule = match:class ^(plank)$, float on
windowrule = match:class ^(pavucontrol)$, float on
windowrule = match:class ^(blueman-manager)$, float on
windowrule = match:class ^(nm-connection-editor)$, float on
windowrule = match:title ^(wlogout)$, float on

# --- Keybinds ---------------------------------------------------------------
$mod = SUPER

bind = $mod, Return, exec, alacritty
bind = $mod, Q, killactive,
bind = $mod, D, exec, wofi --show drun
bind = $mod, E, exec, thunar
bind = $mod, V, exec, sh -c 'cliphist list | wofi --dmenu | cliphist decode | wl-copy'
bind = $mod, L, exec, hyprlock
bind = $mod, ESCAPE, exec, wlogout
bind = $mod, W, exec, eww open widget-panel || eww close widget-panel
bind = $mod, F, togglefloating,
bind = $mod, P, pseudo,
bind = $mod, J, layoutmsg, togglesplit
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy

# Alt-Tab style window cycling
bind = ALT, Tab, cyclenext,
bind = ALT, Tab, bringactivetotop,
bind = ALT SHIFT, Tab, cyclenext, prev
bind = ALT SHIFT, Tab, bringactivetotop,

bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

bindel = , XF86AudioRaiseVolume, exec, pamixer -i 5
bindel = , XF86AudioLowerVolume, exec, pamixer -d 5
bindel = , XF86AudioMute, exec, pamixer -t
bindel = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
