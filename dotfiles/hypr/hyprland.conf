# Deployed by 5-dotfiles.sh. Accent colors (colors.conf) and the GTK/icon/
# cursor theme (__CURSOR_THEME__ below) are set per-theme by theme.sh --
# see the README's theme switching section.

# Default: auto-detect and use each monitor's preferred mode. For
# multi-monitor layouts (position, rotation, etc.), use hyprmod's GUI
# instead of hand-editing this -- it writes to its own config, which
# Hyprland picks up independently of this file.
monitor = ,preferred,auto,auto

# Matugen-templated (see the README's color theming section) -- static
# fallback until you pick a wallpaper via waypaper.
source = ~/.config/hypr/colors.conf

env = XCURSOR_THEME,__CURSOR_THEME__
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,__CURSOR_THEME__
env = HYPRCURSOR_SIZE,24

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
    sensitivity = 0
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    # The theme's two main accents (variables from colors.conf, deployed
    # by theme.sh and Matugen-templated after that -- see the README's
    # theme switching / color theming sections)
    col.active_border = $colActiveBorder1 $colActiveBorder2 45deg
    col.inactive_border = $colInactiveBorder $colInactiveBorder2 45deg
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 0.95
    blur {
        enabled = true
        size = 6
        passes = 2
    }
    shadow {
        enabled = true
        range = 12
        color = rgba(2e303ecc)
    }
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    animation = windows, 1, 4, easeOutQuint
    animation = windowsOut, 1, 4, easeOutQuint, popin 80%
    animation = border, 1, 6, default
    animation = fade, 1, 4, default
    animation = workspaces, 1, 4, easeOutQuint
}

dwindle {
    # 'pseudotile' (default-on pseudotiling for every new window) was
    # removed in Hyprland 0.55 -- pseudotiling is per-window only now,
    # via the 'pseudo' dispatcher (see the $mod+P bind below).
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# --- Autostart ------------------------------------------------------------
exec-once = waybar
exec-once = swaync
# nohup/disown-equivalent: `uwsm app --` fully detaches it from the
# exec-once launcher's process group -- a bare `awww-daemon` here can end up
# job-controlled by whatever spawns exec-once entries and get suspended
# (SIGTSTP) instead of backgrounded, which silently wedges the daemon (it
# keeps holding the wayland socket but stops answering `awww img` -- every
# client call then hangs until it times out, with no error printed).
exec-once = uwsm app -- awww-daemon
exec-once = hypridle
exec-once = systemctl --user enable --now hyprpolkitagent.service
exec-once = nm-applet --indicator
exec-once = blueman-applet
# 10s delay avoids the dock and waybar fighting over layer-shell placement
# during startup (see the nwg-dock-hyprland config credit in the README) --
# -p left/-i 24/-mt 10/-mb 10/-ml 5/-f position, icon size, and margins it;
# -x makes this same command double as a toggle (see the ALT+SHIFT+H bind
# below), since nwg-dock-hyprland exits an already-running instance instead
# of opening a second one.
exec-once = sleep 10 && nwg-dock-hyprland -x -p "left" -i 24 -mt 10 -mb 10 -ml 5 -f
exec-once = wl-paste --watch cliphist store
exec-once = eww daemon

# --- Layer rules -------------------------------------------------------------
# Same match:-prefix overhaul as windowrule above -- layerrule needs
# match:namespace instead of a bare namespace regex now.
layerrule = blur on, match:namespace gtk-layer-shell

# --- Window rules -----------------------------------------------------------
# windowrulev2 was deprecated in favor of windowrule, which as of the 0.53
# window-rule overhaul requires a 'match:' prefix instead of bare
# class:/title: -- see https://github.com/hyprwm/Hyprland/discussions/13115
windowrule = match:class ^(pavucontrol)$, float on
windowrule = match:class ^(blueman-manager)$, float on
windowrule = match:class ^(nm-connection-editor)$, float on
windowrule = match:title ^(wlogout)$, float on
# Dropdown terminal (Super+Alt+T below) -- a plain alacritty spawn tagged
# with its own class so this rule can float/size/center it and route it
# into its own special workspace instead of tiling normally.
windowrule = match:class ^(dropterm)$, float on, size 60% 60%, center on, workspace special:dropterm silent

# --- Keybinds ---------------------------------------------------------------
# Keyed to match HyDE-Project/HyDE's own KEYBINDINGS.md
# (https://github.com/HyDE-Project/HyDE/blob/master/KEYBINDINGS.md) where
# this repo has an equivalent app/dispatcher for it. Not ported: HyDE
# binds that call into its own ~/.local/lib/hyde/ helper script library
# this repo doesn't install -- wallbash mode selector, waybar layout
# cycling, animations/hyprlock layout pickers, game mode/launcher, the
# generated keybind-hint menu, GPU/CPU/sensor widgets, an updates
# checker, OCR "scan text", true freeze-frame screenshot, and per-window
# audio mute (same reasoning as the waybar module comment above). A
# couple of this repo's own pre-existing binds are kept as extra aliases
# alongside HyDE's key (e.g. Super+Return and Super+F still work, not just
# Super+T and Super+W) since nothing here actually conflicts with them.
$mod = SUPER

# Window management
bind = $mod, Q, killactive,
bind = ALT, F4, killactive,
bind = $mod ALT, F4, forcekillactive,
bind = $mod, Delete, exit,
bind = $mod, W, togglefloating,
bind = $mod, F, togglefloating,
bind = $mod, G, togglegroup,
bind = ALT, P, pseudo,
# Hyprland has no native 3-state "cycle" -- this is a plain fullscreen
# toggle (HyDE's version cycles through an extra maximize state via its
# own script).
bind = SHIFT, F11, fullscreen, 0
bind = $mod, L, exec, hyprlock
bind = $mod SHIFT, F, pin,
bind = ALT CTRL, Delete, exec, wlogout
bind = $mod, ESCAPE, exec, wlogout
bind = $mod CTRL, B, exec, pkill -x waybar || waybar
bind = $mod, J, layoutmsg, togglesplit

# Group navigation
bind = $mod CTRL, H, changegroupactive, b
bind = $mod CTRL, L, changegroupactive, f

# Change focus
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

# Alt-Tab style window cycling
bind = ALT, Tab, cyclenext,
bind = ALT, Tab, bringactivetotop,
bind = ALT SHIFT, Tab, cyclenext, prev
bind = ALT SHIFT, Tab, bringactivetotop,

# Resize active window
bind = $mod SHIFT, right, resizeactive, 20 0
bind = $mod SHIFT, left, resizeactive, -20 0
bind = $mod SHIFT, up, resizeactive, 0 -20
bind = $mod SHIFT, down, resizeactive, 0 20

# Move/resize with mouse -- or Z/X held like a mouse button, no mouse needed
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
bindm = $mod, Z, movewindow
bindm = $mod, X, resizewindow

# Misc: move the active window between tiles
bind = $mod CTRL SHIFT, left, movewindow, l
bind = $mod CTRL SHIFT, right, movewindow, r
bind = $mod CTRL SHIFT, up, movewindow, u
bind = $mod CTRL SHIFT, down, movewindow, d

# Launcher: apps
bind = $mod, Return, exec, alacritty
bind = $mod, T, exec, alacritty
bind = $mod ALT, T, exec, hyprctl clients | grep -q dropterm && hyprctl dispatch togglespecialworkspace dropterm || alacritty --class dropterm
bind = $mod, E, exec, thunar
bind = $mod, C, exec, code
bind = $mod, B, exec, brave
bind = CTRL SHIFT, Escape, exec, alacritty -e top

# Launcher: Rofi menus
bind = $mod, D, exec, rofi -show drun -modi drun,filebrowser,window,run
bind = $mod, A, exec, rofi -show drun -modi drun,filebrowser,window,run
bind = $mod, TAB, exec, rofi -show drun -modi drun,filebrowser,window,run
bind = $mod SHIFT, E, exec, rofi -show filebrowser
bind = $mod, V, exec, sh -c 'cliphist list | rofi -dmenu -theme ~/.config/rofi/clipboard.rasi | cliphist decode | wl-copy'
bind = $mod SHIFT, V, exec, sh -c 'cliphist list | rofi -dmenu -theme ~/.config/rofi/clipboard.rasi | cliphist decode | wl-copy'
bind = $mod SHIFT, slash, exec, sh -c 'q="$(rofi -dmenu -p Search)"; [ -n "$q" ] && xdg-open "https://www.google.com/search?q=$q"'

# Hardware controls: audio
bindel = , XF86AudioRaiseVolume, exec, pamixer -i 5
bindel = , XF86AudioLowerVolume, exec, pamixer -d 5
bindel = , XF86AudioMute, exec, pamixer -t
bind = , F10, exec, pamixer -t
bind = , F11, exec, pamixer -d 5
bind = , F12, exec, pamixer -i 5
bind = , XF86AudioMicMute, exec, pamixer --default-source -t

# Hardware controls: media (needs playerctl)
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPause, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# Hardware controls: brightness
bindel = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Utilities: screen capture
bind = , Print, exec, grim - | wl-copy
bind = $mod, P, exec, grim -g "$(slurp)" - | wl-copy
bind = $mod ALT, P, exec, grim -o "$(hyprctl monitors | awk '/^Monitor/{n=$2} /focused: yes/{print n}')" - | wl-copy

# Theming and wallpaper -- already on HyDE's own key combos
bind = $mod SHIFT, W, exec, waypaper
bind = $mod SHIFT, T, exec, ~/.config/hyde-themes/theme.sh menu

# Workspaces: navigation
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10
bind = $mod CTRL, down, workspace, empty
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# Workspaces: relative
bind = $mod CTRL, right, workspace, e+1
bind = $mod CTRL, left, workspace, e-1

# Workspaces: special (scratchpad)
bind = $mod SHIFT, S, movetoworkspace, special
bind = $mod ALT, S, movetoworkspacesilent, special
bind = $mod, S, togglespecialworkspace,

# Workspaces: move window silently
bind = $mod ALT, 1, movetoworkspacesilent, 1
bind = $mod ALT, 2, movetoworkspacesilent, 2
bind = $mod ALT, 3, movetoworkspacesilent, 3
bind = $mod ALT, 4, movetoworkspacesilent, 4
bind = $mod ALT, 5, movetoworkspacesilent, 5
bind = $mod ALT, 6, movetoworkspacesilent, 6
bind = $mod ALT, 7, movetoworkspacesilent, 7
bind = $mod ALT, 8, movetoworkspacesilent, 8
bind = $mod ALT, 9, movetoworkspacesilent, 9
bind = $mod ALT, 0, movetoworkspacesilent, 10

# Workspaces: move window to workspace
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10
bind = $mod ALT CTRL, right, movetoworkspace, e+1
bind = $mod ALT CTRL, left, movetoworkspace, e-1

# Repo-specific extras -- not part of HyDE's list
bind = $mod, N, exec, swaync-client -t -sw
# Eww widget panel -- moved off Super+W since HyDE uses that for float-toggle
bind = $mod, M, exec, eww open widget-panel || eww close widget-panel
bind = ALT SHIFT, H, exec, nwg-dock-hyprland -x -p "left" -i 24 -mt 10 -mb 10 -ml 5 -f
