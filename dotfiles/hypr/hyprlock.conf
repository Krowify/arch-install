background {
    monitor =
    color = rgba(1e1e2eee)
    blur_passes = 2
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgba(cba6f7ee)
    inner_color = rgba(313244ee)
    font_color = rgba(cdd6f4ee)
    fade_on_empty = true
    placeholder_text = <span foreground="##cdd6f4">Password...</span>
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M:%S")"
    color = rgba(cdd6f4ee)
    font_size = 64
    position = 0, 150
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(bac2deee)
    font_size = 18
    position = 0, 60
    halign = center
    valign = center
}
