# Deployed by 5-dotfiles.sh into ~/.config/hyde-themes/tokyo-night/. Read
# by theme.sh.
#
# Neither the Tokyo-Night GTK theme nor the Tela-circle-purple icon theme
# is packaged in the official Arch repos or (as far as this repo has
# verified) the AUR under a reliable name, so rather than guess a package
# name that might not exist, theme.sh downloads these two archives
# straight from HyDE-Project/hyde-themes (the same assets HyDE itself
# ships for this theme) the first time you switch to Tokyo Night, and
# extracts them into ~/.local/share/{themes,icons}. See the README's
# theme switching section.

GTK_THEME_GLOB="Tokyo-Night*"
GTK_THEME_ASSET_URL="https://raw.githubusercontent.com/HyDE-Project/hyde-themes/Tokyo-Night/Source/Gtk_TokyoNight.tar.gz"

ICON_THEME_GLOB="Tela-circle-purple*"
ICON_THEME_ASSET_URL="https://raw.githubusercontent.com/HyDE-Project/hyde-themes/Tokyo-Night/Source/Icon_TelaPurple.tar.gz"

# Bundled wallpaper (see wallpaper.png in this directory) -- Tokyo Night is
# a curated static palette, not one Matugen derives from a wallpaper, so
# theme.sh sets this directly via awww rather than routing it through
# waypaper/Matugen. "Illustration by Sayybils" (credited in-image) --
# ported from HyDE-Project/hyde-themes (Tokyo-Night branch), see the
# README's Credits section.
WALLPAPER="wallpaper.png"
