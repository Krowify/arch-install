# Deployed by theme.sh into ~/.config/alacritty/colors.toml. Static --
# overwritten in-place by Matugen once you pick a wallpaper via waypaper
# (see the README's color theming section). Only background/foreground/
# cursor are templated -- the ANSI 16-color palette in alacritty.toml
# stays static regardless of theme, since neither Matugen nor a curated
# theme swap defines semantic roles for "ANSI green"/"ANSI cyan" etc., and
# remapping them would make ls/diff/etc. output unpredictable.

[colors.primary]
background = "#292a37"
foreground = "#d9e0ee"

[colors.cursor]
text = "#292a37"
cursor = "#efb993"
