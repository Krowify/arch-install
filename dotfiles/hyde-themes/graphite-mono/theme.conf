# Deployed by 5-dotfiles.sh into ~/.config/hyde-themes/graphite-mono/.
# Read by theme.sh.
#
# GTK/icon theme archives ported straight from HyDE-Project/hyde-themes
# (same approach as tokyo-night/theme.conf -- neither is packaged in the
# official repos or a known-good AUR package). Confirmed present under
# Source/ on the Graphite-Mono branch. theme.sh fetches them the first
# time you switch to this theme and extracts into
# ~/.local/share/{themes,icons}.
#
# This theme's color files (hypr-colors.conf, waybar-colors.css,
# rofi-colors.rasi, alacritty-colors.toml) are ported from HyDE's actual
# hypr.theme/waybar.theme/rofi.theme/kitty.theme on the Graphite-Mono
# branch (found under Configs/.config/hyde/themes/Graphite Mono/),
# confirmed as a pure grayscale palette (no chromatic accent). The
# extended Material-You-shaped role sets (waybar's/wlogout's full token
# list) and SwayNC's/Eww's colors are still this repo's own derivation
# from those real anchors -- HyDE doesn't define per-app roles that
# granular either. See theme.conf's counterpart in decay-green/ for the
# same pattern.

GTK_THEME_GLOB="Graphite-Mono*"
GTK_THEME_FALLBACK_GLOB="Graphite*"
GTK_THEME_ASSET_URL="https://raw.githubusercontent.com/HyDE-Project/hyde-themes/Graphite-Mono/Source/Gtk_GraphiteMono.tar.gz"

ICON_THEME_GLOB="Tela-circle-grey*"
ICON_THEME_FALLBACK_GLOB="Tela*"
ICON_THEME_ASSET_URL="https://raw.githubusercontent.com/HyDE-Project/hyde-themes/Graphite-Mono/Source/Icon_TelaGrey.tar.gz"

# Bundled wallpaper -- shared pool at dotfiles/hyde-themes/wallpapers/
# (not per-theme like Tokyo Night's, since this one didn't come from
# HyDE's own repo). Path is relative to this directory.
WALLPAPER="../wallpapers/monochrome.jpg"
