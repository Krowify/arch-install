# Deployed by theme.sh into ~/.config/hypr/colors.conf. Graphite Mono
# palette -- pure grayscale, no hue (see the disclaimer in theme.conf in
# this same directory). Not touched by Matugen: picking a new wallpaper
# via waypaper still re-themes everything dynamically (that's unchanged),
# but theme.sh itself sets these directly rather than deriving them from
# a wallpaper.

$colActiveBorder1 = rgba(cfcfcfff)
$colActiveBorder2 = rgba(9a9a9aff)
$colInactiveBorder = rgba(4d4d4dcc)
$colInactiveBorder2 = rgba(6e6e6ecc)
