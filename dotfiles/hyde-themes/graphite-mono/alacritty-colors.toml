# Deployed by theme.sh into ~/.config/alacritty/colors.toml. Graphite
# Mono palette -- ported from HyDE-Project/hyde-themes' own kitty.theme
# (Graphite-Mono branch). Not touched by Matugen; see hypr-colors.conf
# for why. ANSI palette in alacritty.toml itself stays static regardless
# of theme -- see the README's color theming section.

[colors.primary]
background = "#262626"
foreground = "#d9d9d9"

[colors.cursor]
text = "#d9d9d9"
cursor = "#a6a6a6"
