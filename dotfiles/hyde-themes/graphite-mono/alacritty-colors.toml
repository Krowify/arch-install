# Deployed by theme.sh into ~/.config/alacritty/colors.toml. Graphite
# Mono palette -- pure grayscale, no hue (see theme.conf in this same
# directory). Not touched by Matugen; see hypr-colors.conf for why. ANSI
# palette in alacritty.toml itself stays static regardless of theme -- see
# the README's color theming section.

[colors.primary]
background = "#232323"
foreground = "#b0b0b0"

[colors.cursor]
text = "#1a1a1a"
cursor = "#e5e5e5"
