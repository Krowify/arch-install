# Deployed by theme.sh into ~/.config/alacritty/colors.toml. Decay Green
# palette -- this repo's own construction, not a verified port (see
# theme.conf in this same directory). Not touched by Matugen; see
# hypr-colors.conf for why. ANSI palette in alacritty.toml itself stays
# static regardless of theme -- see the README's color theming section.

[colors.primary]
background = "#1c2216"
foreground = "#b7c2a1"

[colors.cursor]
text = "#14180f"
cursor = "#d7ddc9"
