# Deployed by theme.sh into ~/.config/alacritty/colors.toml. Decay Green
# palette -- ported from HyDE-Project/hyde-themes' own kitty.theme
# (Decay-Green branch). Not touched by Matugen; see hypr-colors.conf for
# why. ANSI palette in alacritty.toml itself stays static regardless of
# theme -- see the README's color theming section.

[colors.primary]
background = "#0d0f18"
foreground = "#a5b6cf"

[colors.cursor]
text = "#a5b6cf"
cursor = "#cbced3"
