# Deployed by 5-dotfiles.sh into ~/.config/hyde-themes/decay-green/. Read
# by theme.sh.
#
# GTK/icon theme archives ported straight from HyDE-Project/hyde-themes
# (same approach as tokyo-night/theme.conf -- neither is packaged in the
# official repos or a known-good AUR package). Confirmed present under
# Source/ on the Decay-Green branch. theme.sh fetches them the first time
# you switch to this theme and extracts into ~/.local/share/{themes,icons}.
#
# UNLIKE Tokyo Night, this theme's *color* files (hypr-colors.conf,
# waybar-*.css, etc. in this directory) are this repo's own construction,
# not a verified port of HyDE's actual Decay Green palette -- the
# upstream theme.dcol/hypr.theme source for this branch wasn't reliably
# fetchable while building this. They're a coherent dark/moss-green
# palette in the same structural shape as the other themes here, not
# pixel-matched to HyDE's real Decay Green. If you want an exact match,
# pull the real values from
# https://github.com/HyDE-Project/hyde-themes/tree/Decay-Green and swap
# them into this directory's color files -- no other wiring needed.

GTK_THEME_GLOB="Decay-Green*"
GTK_THEME_FALLBACK_GLOB="Decay*"
GTK_THEME_ASSET_URL="https://raw.githubusercontent.com/HyDE-Project/hyde-themes/Decay-Green/Source/Gtk_DecayGreen.tar.gz"

ICON_THEME_GLOB="Tela-circle-green*"
ICON_THEME_FALLBACK_GLOB="Tela*"
ICON_THEME_ASSET_URL="https://raw.githubusercontent.com/HyDE-Project/hyde-themes/Decay-Green/Source/Icon_TelaGreen.tar.gz"

# No bundled wallpaper -- unlike Tokyo Night, no verified wallpaper asset
# for this theme was found. Falls back to whatever's already set.
